name: Daily digital product pipeline

on:
  schedule:
    - cron: '17 04 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: Optional product topic override
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PUBLIC_R2_DOMAIN: ${{ secrets.PUBLIC_R2_DOMAIN }}
      PIPELINE_PUBLISH_SECRET: ${{ secrets.PIPELINE_PUBLISH_SECRET }}
      NEXTJS_PUBLISH_URL: ${{ secrets.NEXTJS_PUBLISH_URL }}
      PRODUCT_TOPIC: ${{ inputs.topic }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r automation/requirements.txt
      - run: python automation/pipeline_runner.py
